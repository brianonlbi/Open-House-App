<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Household Finances — tests</title>
<!--
  Tests. No npm, no build step, no runner to install.

  Start the app with start.command, then open:
      http://localhost:8777/tests/tests.html

  It loads ../finances.html?test=1 in a hidden iframe. The ?test=1 flag makes
  the app skip its own startup, so running tests never touches your real data
  file, your folder permission, or the browser cache.

  Each parser added in build step 2 onward gets its own block below, checked
  against the anonymized fixtures in tests/samples/.
-->
<style>
  body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
         margin: 24px; max-width: 900px; color: #16191d; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .meta { color: #5c6370; margin-bottom: 16px; }
  #summary { font-weight: 600; padding: 8px 12px; border-radius: 4px; margin-bottom: 16px; }
  #summary.pass { background: #e4f6eb; color: #17733f; }
  #summary.fail { background: #fdecea; color: #a8301c; }
  .group { margin-bottom: 14px; }
  .group > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
                color: #5c6370; margin: 0 0 4px; }
  .case { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
          padding: 2px 0 2px 20px; position: relative; }
  .case.ok::before   { content: "✓"; position: absolute; left: 2px; color: #17733f; }
  .case.bad::before  { content: "✗"; position: absolute; left: 2px; color: #a8301c; }
  .case.bad { color: #a8301c; }
  .detail { color: #5c6370; padding-left: 22px; font-size: 11px; white-space: pre-wrap; }
  iframe { display: none; }
</style>
</head>
<body>
<h1>Household Finances — tests</h1>
<div class="meta">Run from a served origin, not <code>file://</code>.</div>
<div id="summary">Running…</div>
<div id="results"></div>
<iframe id="app" src="../finances.html?test=1"></iframe>

<script>
"use strict";

/* --------------------------------------------------------------- harness */
let passed = 0, failed = 0, group = null;

function describe(name) {
  group = document.createElement("div");
  group.className = "group";
  group.innerHTML = "<h2></h2>";
  group.querySelector("h2").textContent = name;
  document.getElementById("results").append(group);
}

function ok(name, cond, detail) {
  const line = document.createElement("div");
  line.className = "case " + (cond ? "ok" : "bad");
  line.textContent = name;
  group.append(line);
  if (cond) { passed++; return; }
  failed++;
  if (detail !== undefined) {
    const d = document.createElement("div");
    d.className = "detail";
    d.textContent = String(detail);
    group.append(d);
  }
}

const eq = (name, actual, expected) =>
  ok(name, Object.is(actual, expected), `expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);

const deepEq = (name, actual, expected) =>
  ok(name, JSON.stringify(actual) === JSON.stringify(expected),
     `expected ${JSON.stringify(expected)}\n     got ${JSON.stringify(actual)}`);

/** Fetch an anonymized fixture from tests/samples/. */
async function sample(filename) {
  const res = await fetch("samples/" + filename);
  if (!res.ok) throw new Error(`fixture samples/${filename} not found (${res.status})`);
  return res.text();
}

/* ------------------------------------------------------------------ run */
async function run(API) {

  describe("data model");
  {
    const fresh = API.newDataFile();
    eq("new file carries the current schema version", fresh.schema_version, API.SCHEMA_VERSION);
    deepEq("new file starts with no transactions", fresh.transactions, []);
    deepEq("new file starts with no categories (they are yours to choose)", fresh.categories, []);
    deepEq("new file starts with no rules", fresh.rules, []);
    deepEq("new file starts with no overrides", fresh.overrides, {});
    ok("new file records when it was created", typeof fresh.created === "string" && fresh.created.includes("T"));
  }

  describe("migrate() — old or hand-edited files are repaired, not rejected");
  {
    const bare = API.migrate({ transactions: [{ id: "a", date: "2026-01-01", amount: -5 }] });
    eq("stamps the current schema version", bare.schema_version, API.SCHEMA_VERSION);
    eq("keeps the transactions it was given", bare.transactions.length, 1);
    deepEq("fills in a missing rules array", bare.rules, []);
    deepEq("fills in a missing overrides object", bare.overrides, {});
    deepEq("fills in a missing column_maps object", bare.column_maps, {});

    const corrupt = API.migrate({ transactions: null, rules: "nope", overrides: 7 });
    deepEq("repairs a non-array transactions field", corrupt.transactions, []);
    deepEq("repairs a non-array rules field", corrupt.rules, []);
    deepEq("repairs a non-object overrides field", corrupt.overrides, {});

    const existing = API.migrate({ created: "2020-01-01T00:00:00.000Z", transactions: [] });
    eq("an account with no kind gets one, so screens that show it do not break",
       API.migrate({ accounts: [{ id: "chk", label: "Checking" }] }).accounts[0].kind, "unknown");
    eq("a kind that is there is left alone",
       API.migrate({ accounts: [{ id: "chk", label: "Checking", kind: "checking" }] }).accounts[0].kind,
       "checking");

    eq("does not overwrite the original created date", existing.created, "2020-01-01T00:00:00.000Z");
  }

  describe("summary() — the numbers in the status bar");
  {
    const saved = API.state.data;
    API.state.data = API.migrate({ transactions: [
      { id:"1", date:"2026-03-04", amount:-20, account:"amex",     category:"Gas" },
      { id:"2", date:"2026-01-09", amount:-60, account:"checking", category:"" },
      { id:"3", date:"2026-02-02", amount:-15, account:"checking", category:"Uncategorized" },
    ]});
    const s = API.summary();
    eq("counts every transaction", s.count, 3);
    eq("counts distinct accounts", s.accounts, 2);
    eq("finds the earliest date", s.first, "2026-01-09");
    eq("finds the latest date", s.last, "2026-03-04");
    eq("counts blank and 'Uncategorized' alike as uncategorized", s.uncategorized, 2);

    API.state.data = API.migrate({ transactions: [] });
    const none = API.summary();
    eq("empty file counts zero", none.count, 0);
    eq("empty file has no date range", none.first, null);

    API.state.data = saved;
  }

  describe("parseCSV");
  {
    deepEq("splits a plain row", API.parseCSV("a,b,c"), [["a", "b", "c"]]);
    deepEq("keeps a comma inside quotes", API.parseCSV('a,"b,c",d'), [["a", "b,c", "d"]]);
    deepEq("unescapes a doubled quote", API.parseCSV('a,"say ""hi""",c'), [["a", 'say "hi"', "c"]]);
    deepEq("handles a newline inside quotes", API.parseCSV('a,"one\ntwo",c'), [["a", "one\ntwo", "c"]]);
    deepEq("handles CRLF line endings", API.parseCSV("a,b\r\nc,d"), [["a", "b"], ["c", "d"]]);
    deepEq("strips a leading BOM", API.parseCSV("﻿a,b"), [["a", "b"]]);
    deepEq("drops blank lines", API.parseCSV("a,b\n\n\nc,d"), [["a", "b"], ["c", "d"]]);
    deepEq("keeps empty trailing fields", API.parseCSV("a,b,"), [["a", "b", ""]]);
  }

  describe("toISODate");
  {
    eq("MM/DD/YYYY", API.toISODate("09/14/2026"), "2026-09-14");
    eq("pads a single-digit month and day", API.toISODate("1/5/2026"), "2026-01-05");
    eq("two-digit year in this century", API.toISODate("1/5/26"), "2026-01-05");
    eq("rejects a non-date", API.toISODate("not a date"), "");
    eq("rejects an empty string", API.toISODate(""), "");
  }

  describe("hashId / assignIds");
  {
    ok("the same key always hashes the same", API.hashId("x") === API.hashId("x"));
    ok("different keys hash differently", API.hashId("x") !== API.hashId("y"));

    // The case real data exposed: two genuinely separate charges, identical in
    // every field. Naive dedup would silently swallow the second one.
    const twins = () => ([
      { account: "a", date: "2026-08-07", amount: -26, description: "SAME MERCHANT" },
      { account: "a", date: "2026-08-07", amount: -26, description: "SAME MERCHANT" },
      { account: "a", date: "2026-08-08", amount: -26, description: "SAME MERCHANT" },
    ]);
    const run1 = API.assignIds(twins());
    ok("identical rows still get distinct ids", run1[0].id !== run1[1].id);
    ok("a different date gives a different id", run1[1].id !== run1[2].id);

    const run2 = API.assignIds(twins());
    deepEq("re-importing the same rows reproduces the same ids",
           run2.map((t) => t.id), run1.map((t) => t.id));

    const other = API.assignIds([
      { account: "b", date: "2026-08-07", amount: -26, description: "SAME MERCHANT" },
    ]);
    ok("the same row on another account is a different transaction", other[0].id !== run1[0].id);
  }

  describe("detectParser / inferAccount");
  {
    const csv = await sample("chase_card-sample.csv");
    eq("recognises a Chase card export", API.detectParser(csv).id, "chase_card");
    eq("does not claim an unknown file", API.detectParser("Foo,Bar\n1,2").id, null);

    const acct = API.inferAccount("Chase1234_Activity_20260916.csv", API.PARSERS.chase_card);
    eq("reads the institution off the filename", acct.institution, "Chase");
    eq("builds a stable account id", acct.id, "chase-1234");
    eq("labels it with the last four", acct.label, "Chase …1234");
    eq("knows it is a credit card", acct.kind, "credit_card");
  }

  describe("parser: chase_card");
  {
    const csv = await sample("chase_card-sample.csv");
    const out = API.PARSERS.chase_card.parse(csv, "chase_card-sample.csv", "chase-0000");
    const rows = out.transactions;
    API.assignIds(rows);

    eq("reads every data row", rows.length, 13);
    deepEq("no unreadable rows", out.problems, []);
    eq("did not need to flip signs", out.flipped, false);

    eq("dates are ISO", rows[0].date, "2026-09-14");
    eq("keeps the post date too", rows[0].post_date, "2026-09-15");
    eq("money out is negative", rows[0].amount, -59);
    eq("tags the source file", rows[0].source_file, "chase_card-sample.csv");
    eq("assigns the account", rows[0].account, "chase-0000");
    eq("leaves category empty for the rules pass", rows[0].category, "");

    // The invariant: the raw description is never touched.
    eq("keeps a comma inside a quoted description", rows[1].description, "SAMPLE GROCER, LLC");
    eq("keeps double spaces verbatim", rows[5].description, "SAMPLE STREAM  *800-000-0000");
    eq("keeps an HTML entity verbatim", rows[8].description, "SAMPLE B&amp;H SUPPLY 800-000-0000");
    eq("keeps an apostrophe verbatim", rows[11].description, "SAMPLE DINER'S CLUB F1234");

    // The thing that makes homemade finance apps produce wrong numbers.
    const payment = rows.find((t) => t.issuer_type === "Payment");
    eq("a card payment becomes a transfer", payment.type, "transfer");
    ok("the card payment is positive", payment.amount > 0);

    const refund = rows.find((t) => t.issuer_type === "Return");
    eq("a refund stays an expense, not income", refund.type, "expense");
    ok("the refund is positive so it nets against its category", refund.amount > 0);

    const fee = rows.find((t) => t.description === "LATE FEE");
    eq("a fee is a real expense", fee.type, "expense");
    ok("the fee is negative", fee.amount < 0);

    // The issuer's own category is kept for reference but is never authoritative.
    const fuel = rows.filter((t) => t.description.startsWith("SAMPLE FUEL STOP"));
    eq("two charges at the same fuel merchant", fuel.length, 2);
    ok("the issuer categorised them inconsistently",
       fuel[0].issuer_category !== fuel[1].issuer_category,
       fuel[0].issuer_category + " vs " + fuel[1].issuer_category);
    ok("so neither is used as our category", fuel.every((t) => t.category === ""));

    // Identical rows inside one file.
    const tolls = rows.filter((t) => t.description === "SAMPLE TOLLS INC.");
    eq("both identical toll charges survive", tolls.length, 2);
    ok("with distinct ids", tolls[0].id !== tolls[1].id);

    // Re-parsing is stable, which is what makes re-imports dedup.
    const again = API.PARSERS.chase_card.parse(csv, "chase_card-sample.csv", "chase-0000");
    API.assignIds(again.transactions);
    deepEq("parsing the same file twice yields identical ids",
           again.transactions.map((t) => t.id), rows.map((t) => t.id));

    // The totals a naive import would get wrong.
    const naive = rows.reduce((sum, t) => sum + t.amount, 0);
    const real = rows.filter((t) => t.type !== "transfer").reduce((sum, t) => sum + t.amount, 0);
    ok("excluding the transfer changes the total", Math.abs(naive - real) > 1,
       "naive " + naive.toFixed(2) + " vs " + real.toFixed(2));
    eq("spending total excludes the card payment", Number(real.toFixed(2)), -1021.37);
  }

  describe("parser: chase_card — inverted-sign export");
  {
    // Some issuers report purchases as positive. The parser must notice and flip
    // rather than importing every expense backwards.
    const csv = (await sample("chase_card-sample.csv"))
      .split("\n")
      .map((line, i) => (i === 0 || !line.trim() ? line : line.replace(/,-(\d)/, ",$1")))
      .join("\n");
    const out = API.PARSERS.chase_card.parse(csv, "flipped.csv", "chase-0000");
    eq("notices the export is inverted", out.flipped, true);
    const sale = out.transactions.find((t) => t.issuer_type === "Sale");
    ok("purchases end up negative anyway", sale.amount < 0, String(sale.amount));
  }

  describe("parser: apple_card");
  {
    const csv = await sample("apple_card-sample.csv");
    eq("recognised by header alone", API.detectParser(csv).id, "apple_card");

    const out = API.PARSERS.apple_card.parse(csv, "apple_card-sample.csv", "apple-card");
    const rows = out.transactions;
    rows.forEach((t) => { t.source_parser = "apple_card"; });
    API.assignIds(rows);

    eq("reads every data row", rows.length, 11);
    deepEq("no unreadable rows", out.problems, []);

    // Apple signs the opposite way from Chase. This is the whole point.
    eq("did not need the safety-net flip", out.flipped, false);
    const purchase = rows[0];
    eq("a purchase Apple reports as +36.12 becomes negative", purchase.amount, -36.12);
    const payment = rows.find((t) => t.issuer_type === "Payment");
    eq("a payment Apple reports as -200 becomes positive", payment.amount, 200);
    eq("and is a transfer", payment.type, "transfer");

    eq("dates are ISO", purchase.date, "2026-09-14");
    eq("clearing date becomes post_date", purchase.post_date, "2026-09-15");

    // Apple ships both a full-address description and a clean merchant name.
    ok("description keeps the full raw text",
       purchase.description.includes("20 EAST MAIN STREET"));
    eq("merchant is captured separately", purchase.merchant, "Sample Fuel Stop 497");
    eq("a quoted comma inside the description survives",
       rows[5].description, "SAMPLE HEALTH 116 W. 23RD ST, 4TH FLOOR SAMPLE CITY 00000 NY USA");

    // Shared cards: who spent it.
    eq("purchased_by is captured", rows[2].purchased_by, "Jan Sample");

    // A disputed charge arrives as a Debit/Credit pair.
    const credit = rows.find((t) => t.issuer_type === "Credit");
    eq("a credit is a refund, positive, still an expense", credit.amount, 49.99);
    eq("not income", credit.type, "expense");
    const debit = rows.find((t) => t.issuer_type === "Debit" && t.amount === -49.99);
    ok("its matching debit is negative", debit && debit.amount < 0);

    // Identical rows, again, in a second institution's real export.
    const twins = rows.filter((t) => t.date === "2024-09-11");
    eq("both identical rows survive", twins.length, 2);
    ok("with distinct ids", twins[0].id !== twins[1].id);

    const again = API.PARSERS.apple_card.parse(csv, "apple_card-sample.csv", "apple-card");
    API.assignIds(again.transactions);
    deepEq("re-parsing is stable", again.transactions.map((t) => t.id), rows.map((t) => t.id));
  }

  describe("categories: interest and fees get their own bucket");
  {
    const data = API.migrate({ rules: [], overrides: {}, categories: [], transactions: [] });

    const chaseCsv = await sample("chase_card-sample.csv");
    const chase = API.PARSERS.chase_card.parse(chaseCsv, "c.csv", "chase-1234").transactions;
    chase.forEach((t) => { t.source_parser = "chase_card"; });

    const appleCsv = await sample("apple_card-sample.csv");
    const apple = API.PARSERS.apple_card.parse(appleCsv, "a.csv", "apple-card").transactions;
    apple.forEach((t) => { t.source_parser = "apple_card"; });

    data.transactions = chase.concat(apple);
    API.assignIds(data.transactions);
    API.recategorizeAll(data);

    const fees = data.transactions.filter((t) => t.category === API.FEES_CATEGORY);
    eq("Chase fees and Apple interest land in one category", fees.length, 3);
    ok("from both institutions",
       new Set(fees.map((t) => t.source_parser)).size === 2,
       [...new Set(fees.map((t) => t.source_parser))].join(","));
    ok("every fee is an expense", fees.every((t) => t.type === "expense"));

    const transfers = data.transactions.filter((t) => t.category === API.TRANSFER_CATEGORY);
    eq("card payments from both cards are transfers", transfers.length, 2);

    ok("the category list picked up both new names",
       data.categories.includes(API.FEES_CATEGORY) && data.categories.includes(API.TRANSFER_CATEGORY));

    ok("merchant rows are still uncategorized until rules exist",
       data.transactions.some((t) => t.category === API.UNCATEGORIZED));

    // A rule beats the issuer, and re-deriving updates the whole history.
    data.rules = [{ match: "SAMPLE FUEL STOP", category: "Gas" }];
    API.recategorizeAll(data);
    const gas = data.transactions.filter((t) => t.category === "Gas");
    eq("one rule catches the merchant across both cards", gas.length, 3);
    ok("including the Apple row matched on its merchant column",
       gas.some((t) => t.source_parser === "apple_card"));

    // An override beats a rule.
    const target = gas[0];
    data.overrides[target.id] = { category: "Snacks" };
    API.recategorizeAll(data);
    eq("a manual override wins", data.transactions.find((t) => t.id === target.id).category, "Snacks");

    // Removing the rule puts everything back, because nothing was baked in.
    data.rules = [];
    data.overrides = {};
    API.recategorizeAll(data);
    eq("categories are fully re-derivable",
       data.transactions.filter((t) => t.category === "Gas").length, 0);
  }

  describe("ruleMatches");
  {
    const tx = { description: "SAMPLE FUEL# 497 SOMEWHERE", merchant: "Sample Fuel 497" };
    ok("matches the raw description, case-insensitively", API.ruleMatches({ match: "sample fuel" }, tx));
    ok("matches the clean merchant name too", API.ruleMatches({ match: "Sample Fuel 4" }, tx));
    ok("does not match something absent", !API.ruleMatches({ match: "SAMPLE GROCER" }, tx));
    ok("an empty rule never matches", !API.ruleMatches({ match: "  " }, tx));
  }

  describe("totalsFor — transfers never count as spending");
  {
    const rows = [
      { amount: -100, type: "expense", category: "Gas" },
      { amount: -50,  type: "expense", category: "Gas" },
      { amount: 20,   type: "expense", category: "Gas" },              // refund
      { amount: -30,  type: "expense", category: API.FEES_CATEGORY },  // interest
      { amount: 500,  type: "transfer", category: API.TRANSFER_CATEGORY },
    ];
    const t = API.totalsFor(rows);
    eq("counts every row", t.count, 5);
    eq("spending excludes the transfer and nets the refund", t.spend, -160);
    eq("transfers are reported separately", t.transfers, 500);
    eq("refunds are reported", t.refunds, 20);
    eq("fees are reported", t.fees, -30);
  }

  describe("accountIdFrom");
  {
    eq("slugifies a label", API.accountIdFrom("Best Buy Card", []), "best-buy-card");
    eq("strips punctuation", API.accountIdFrom("Jen's Amex!", []), "jen-s-amex");
    eq("avoids collisions", API.accountIdFrom("Costco", ["costco"]), "costco-2");
    eq("keeps avoiding them", API.accountIdFrom("Costco", ["costco", "costco-2"]), "costco-3");
    eq("never produces an empty id", API.accountIdFrom("!!!", []), "account");
  }

  describe("headerSignature");
  {
    const a = API.headerSignature(["Date", "Description", "Amount"]);
    eq("same columns, same signature", API.headerSignature(["Date", "Description", "Amount"]), a);
    eq("case and padding do not matter", API.headerSignature([" date ", "DESCRIPTION", "Amount"]), a);
    ok("different columns differ", API.headerSignature(["Date", "Amount"]) !== a);
    ok("column order matters", API.headerSignature(["Description", "Date", "Amount"]) !== a);
  }

  describe("guessMapping — a store card with split debit/credit columns");
  {
    const csv = await sample("unknown-split-sample.csv");
    eq("no built-in parser claims it", API.detectParser(csv, null).id, null);

    const rows = API.parseCSV(csv);
    const header = rows[0];
    const map = API.guessMapping(header, rows.slice(1));

    eq("finds the date", map.date, "Date");
    eq("finds the description", map.description, "Description");
    eq("maps money out to its own column", map.debit, "Debit");
    eq("maps money in to its own column", map.credit, "Credit");
    ok("does not invent a combined amount column", !map.amount);
    ok("does not mistake Status for a field we want",
       !Object.values(map).includes("Status"), JSON.stringify(map));
  }

  describe("parserFromSpec — split columns parse without a sign question");
  {
    const csv = await sample("unknown-split-sample.csv");
    const rows = API.parseCSV(csv);
    const map = API.guessMapping(rows[0], rows.slice(1));

    const parser = API.parserFromSpec({
      label: "Sample Store Card", institution: "Sample Store", kind: "credit_card",
      map, transferTypes: [], refundTypes: [], feeTypes: [],
    });
    ok("knows it is using split columns", parser.splitAmounts);

    const out = parser.parse(csv, "store.csv", "store");
    eq("reads every row", out.transactions.length, 7);
    deepEq("nothing unreadable", out.problems, []);
    eq("never needs a sign flip", out.flipped, false);

    const purchase = out.transactions[0];
    eq("a debit becomes negative", purchase.amount, -449.99);
    const payment = out.transactions.find((t) => t.description === "ONLINE PAYMENT THANK YOU");
    eq("a credit becomes positive", payment.amount, 250);
    const refund = out.transactions.find((t) => t.description === "RETURNED MERCHANDISE");
    eq("a returned item is positive too", refund.amount, 44.99);
    eq("a quoted comma still survives", out.transactions[3].description, "SAMPLE TOOLS, INC.");

    const total = out.transactions.reduce((sum, t) => sum + t.amount, 0);
    eq("the arithmetic adds up", Number(total.toFixed(2)), -423.61);
  }

  describe("guessMapping — a checking account export");
  {
    const csv = await sample("unknown-checking-sample.csv");
    eq("no built-in parser claims it", API.detectParser(csv, null).id, null);

    const rows = API.parseCSV(csv);
    const map = API.guessMapping(rows[0], rows.slice(1));

    eq("finds the posting date", map.date, "Posting Date");
    eq("finds the description", map.description, "Description");
    eq("finds the single signed amount column", map.amount, "Amount");
    eq("finds the row type", map.issuer_type, "Type");
    ok("does not claim Balance as the amount", map.amount !== "Balance");

    eq("reads the sign convention off the data", API.guessMoneyOut(rows[0], rows.slice(1), "Amount"), "negative");

    const values = API.typeValues(rows[0], rows.slice(1), "Type");
    ok("lists the distinct row types", values.length >= 5, JSON.stringify(values));
    ok("most common first", values[0][1] >= values[values.length - 1][1]);
  }

  describe("a mapped checking account: income, transfers and fees");
  {
    const csv = await sample("unknown-checking-sample.csv");
    const rows = API.parseCSV(csv);
    const map = API.guessMapping(rows[0], rows.slice(1));

    const spec = {
      label: "Personal Account", institution: "Sample Bank", kind: "checking",
      map, moneyOut: "negative", incomeWhenPositive: true,
      transferTypes: ["ACCT_XFER"], refundTypes: [], feeTypes: ["FEE_TRANSACTION"],

       API.whoSpends(API.migrate({ transactions: [
         { id: "x", date: "2026-01-01", amount: -5, type: "expense", account: "a",
           description: "SAMPLE" }] })).length, 0);

    eq("a blank name is not a person",
       API.whoSpends(API.migrate({ transactions: [
         { id: "x", date: "2026-01-01", amount: -5, type: "expense", account: "a",
           description: "SAMPLE", purchased_by: "  " }] })).length, 0);

    eq("the table shows a first name, not the whole thing",
       API.firstName("JENNIFER MARTIN"), "JENNIFER");
    eq("one word is left alone", API.firstName("SAMPLE"), "SAMPLE");
    eq("nothing in, nothing out", API.firstName(""), "");
    eq("and undefined does not throw", API.firstName(undefined), "");
  }

  describe("guessMapping — a warehouse card names the member who spent it");
  {
    const header = ["Status", "Date", "Description", "Debit", "Credit", "Member Name"];
    const rows = [
      ["Cleared", "01/04/2026", "SAMPLE FUEL", "44.70", "", "SAMPLE ONE"],
      ["Cleared", "01/15/2026", "ONLINE PAYMENT, THANK YOU", "", "-600.00", "SAMPLE TWO"],
      ["Cleared", "01/17/2026", "SAMPLE WAREHOUSE", "438.59", "", "SAMPLE ONE"],
    ];
    const map = API.guessMapping(header, rows);
    eq("Member Name is recognised as who spent it", map.purchased_by, "Member Name");
    eq("the date is found", map.date, "Date");
    eq("money out has its own column", map.debit, "Debit");
    eq("money in has its own column", map.credit, "Credit");
    ok("Status is not mistaken for a field we want",
       Object.values(map).indexOf("Status") === -1);

    // The credit column is written negative here. The column says the direction,
    // so the sign in it must not be allowed to say it twice.
    const parser = API.parserFromSpec({
      label: "Sample", kind: "credit_card", map,
      required: [map.date, map.description],
    });
    const csv = [header].concat(rows)
      .map((r) => r.map((c) => (c.includes(",") ? `"${c}"` : c)).join(","))
      .join("\n");
    const out = parser.parse(csv, "s.csv", "acct");
    eq("every row reads", out.transactions.length, 3);
    eq("a purchase is money out", out.transactions[0].amount, -44.70);
    eq("a payment written as a negative credit is still money IN",
       out.transactions[1].amount, 600);
    eq("and the member comes with it", out.transactions[2].purchased_by, "SAMPLE ONE");
  }

  describe("guessKind — a bank export is not a credit card");
  {
    eq("a cheque number means a bank account",
       API.guessKind(["Account Number", "Post Date", "Check", "Description", "Debit", "Credit"]), "checking");
    eq("so does a running balance",
       API.guessKind(["Date", "Description", "Amount", "Balance"]), "checking");
    eq("a card export has neither",
       API.guessKind(["Transaction Date", "Post Date", "Description", "Category", "Type", "Amount"]),
       "credit_card");
    eq("a word that merely contains 'check' is not a cheque column",
       API.guessKind(["Date", "Checkout Total", "Description", "Amount"]), "credit_card");
  }

  describe("a rule can mark rows as transfers, for exports that do not say");
  {
    // A bank export: a flat list where paying a card looks like buying groceries.
    const make = () => API.migrate({
      accounts: [{ id: "chk", label: "Checking", kind: "checking" }],
      transactions: [
        { id: "t1", date: "2026-01-05", amount: -400, type: "expense", account: "chk",
          description: "SAMPLE CARD ONLINE PAYMENT 1234" },
        { id: "t2", date: "2026-01-06", amount: -60, type: "expense", account: "chk",
          description: "SAMPLE GROCER" },
        { id: "t3", date: "2026-01-07", amount: 2000, type: "income", account: "chk",
          description: "SAMPLE PAYROLL" },
      ],
    });

    const before = make();
    API.recategorizeAll(before);
    eq("untouched, the card payment counts as spending",
       API.totalsFor(before.transactions).spend, -460);

    const data = make();
    API.addRule(data, "CARD ONLINE PAYMENT", "Transfer");
    const card = data.transactions.find((x) => x.id === "t1");
    eq("the rule retypes it", card.type, "transfer");
    eq("and it carries the Transfer category", card.category, "Transfer");
    eq("what the file said is still on the row", card.parsed_type, "expense");
    eq("spending is only the spending now", API.totalsFor(data.transactions).spend, -60);
    eq("and it is reported as a transfer", API.totalsFor(data.transactions).transfers, -400);
    eq("income is untouched", API.totalsFor(data.transactions).income, 2000);

    // Deriving from scratch is the whole point: take the rule away again.
    data.rules = [];
    API.recategorizeAll(data);
    eq("removing the rule puts the type back", data.transactions[0].type, "expense");
    eq("and the spending with it", API.totalsFor(data.transactions).spend, -460);

    // One transaction at a time works the same way.
    const byHand = make();
    API.recategorizeAll(byHand);
    API.setOverride(byHand, byHand.transactions.find((x) => x.id === "t3"), "Transfer");
    API.recategorizeAll(byHand);
    eq("an override can retype a row too", byHand.transactions[2].type, "transfer");
    eq("so that deposit is no longer income", API.totalsFor(byHand.transactions).income, 0);

    // A transfer the parser already knew about is not disturbed by any of this.
    const issuer = API.migrate({
      accounts: [{ id: "card", label: "Card", kind: "credit_card" }],
      transactions: [
        { id: "p1", date: "2026-01-05", amount: 400, type: "transfer", account: "card",
          description: "SAMPLE PAYMENT THANK YOU" },
      ],
    });
    API.recategorizeAll(issuer);
    eq("it keeps its type", issuer.transactions[0].type, "transfer");
    eq("and its category", issuer.transactions[0].category, "Transfer");
    API.setOverride(issuer, issuer.transactions[0], "Debt");
    API.recategorizeAll(issuer);
    eq("naming it something else does not turn it back into spending",
       issuer.transactions[0].type, "transfer");
    eq("though the name is yours", issuer.transactions[0].category, "Debt");
    eq("and it still never counts as spending", API.totalsFor(issuer.transactions).spend, 0);
  }

  describe("migrate backfills what the file said about each row");
  {
    const data = API.migrate({
      accounts: [{ id: "a", label: "A", kind: "checking" }],
      transactions: [
        { id: "x", date: "2026-01-01", amount: -5, type: "expense", account: "a", description: "SAMPLE" },
      ],
    });
    eq("an older file gets its parsed type filled in", data.transactions[0].parsed_type, "expense");
  }

  describe("guessMoneyOut — a statement with no purchases on it");
  {
    // A card that was only paid down: nothing but payments and zero-dollar
    // interest lines. Reading the sign off those rows directly gets it backwards.
    const header = ["Date", "Amount", "Description", "Type"];
    const rows = [
      ["04/10/2026", "$-300.00", "SAMPLE AUTOPAY", "payment"],
      ["04/17/2026", "$0.00", "INTEREST CHARGE ON PURCHASES", "interest charged"],
      ["05/10/2026", "$-300.00", "SAMPLE AUTOPAY", "payment"],
      ["05/19/2026", "$0.00", "INTEREST CHARGE ON PURCHASES", "interest charged"],
      ["06/10/2026", "$-300.00", "SAMPLE AUTOPAY", "payment"],
    ];
    const map = { date: "Date", amount: "Amount", description: "Description", issuer_type: "Type" };
    const isIn = API.moneyInRow(header, map, ["payment"], []);

    ok("the payments are recognised as money coming in", isIn(rows[0]));
    ok("an interest line is not", !isIn(rows[1]));
    eq("money out is positive, read off the payments and inverted",
       API.guessMoneyOut(header, rows, "Amount", isIn), "positive");
    eq("without that, the same file reads exactly backwards",
       API.guessMoneyOut(header, rows, "Amount"), "negative");

    // The ordinary case is unchanged: purchases still decide when there are any.
    const withPurchases = rows.concat([
      ["06/12/2026", "$40.00", "SAMPLE SHOP", "purchase"],
      ["06/13/2026", "$12.00", "SAMPLE SHOP", "purchase"],
      ["06/14/2026", "$90.00", "SAMPLE SHOP", "purchase"],
    ]);
    eq("purchases decide when the statement has some",
       API.guessMoneyOut(header, withPurchases, "Amount", isIn), "positive");

    const theOtherWay = [
      ["06/10/2026", "$300.00", "SAMPLE AUTOPAY", "payment"],
      ["06/12/2026", "$-40.00", "SAMPLE SHOP", "purchase"],
      ["06/13/2026", "$-12.00", "SAMPLE SHOP", "purchase"],
      ["06/14/2026", "$-90.00", "SAMPLE SHOP", "purchase"],
    ];
    eq("an issuer that signs money out negative still reads that way",
       API.guessMoneyOut(header, theOtherWay, "Amount", API.moneyInRow(header, map, ["payment"], [])),
       "negative");
    eq("payments-only, signed the other way, reads the other way too",
       API.guessMoneyOut(header, [theOtherWay[0]], "Amount", isIn), "negative");
    eq("no rows at all falls back to the common convention",
       API.guessMoneyOut(header, [], "Amount", isIn), "negative");
    eq("an amount column that is not there is not guessed at",
       API.guessMoneyOut(header, rows, "Nope", isIn), "negative");
  }

  describe("fileLooksLikeAccount — a mapping says the format, not the card");
  {
    ok("the account's own file matches", API.fileLooksLikeAccount("Home-Depot-2026.csv", "Home Depot"));
    ok("case and separators do not matter", API.fileLooksLikeAccount("home_depot_aug.CSV", "Home Depot"));
    ok("one word in common is enough", API.fileLooksLikeAccount("depot-latest.csv", "Home Depot"));
    ok("a different card with the same columns does not",
       !API.fileLooksLikeAccount("Best-Buy-2026.csv", "Home Depot"));
    ok("short words are ignored rather than matched loosely",
       !API.fileLooksLikeAccount("statement.csv", "My Card"));
    ok("an unnamed account never raises the question", API.fileLooksLikeAccount("anything.csv", ""));
  }

  describe("removing an account forgets how its files were read");
  {
    const data = API.migrate({
      accounts: [{ id: "store-card", label: "Store Card", kind: "credit_card" },
                 { id: "keep", label: "Keep", kind: "credit_card" }],
      transactions: [
        { id: "s1", date: "2026-01-01", amount: -10, type: "expense", account: "store-card", description: "SAMPLE" },
        { id: "k1", date: "2026-01-01", amount: -20, type: "expense", account: "keep", description: "SAMPLE" },
      ],
      column_maps: {
        sig_store: { accountLabel: "Store Card", columns: ["Date", "Amount"], moneyOut: "negative" },
        sig_keep:  { accountLabel: "Keep", columns: ["Date", "Amount"], moneyOut: "negative" },
      },
    });

    const gone = API.removeAccount(data, "store-card");
    eq("the transactions go", gone.removed, 1);
    eq("and so does the mapping that fed them", gone.forgotten, 1);
    ok("the bad mapping is really gone", !data.column_maps.sig_store);
    ok("the other account's mapping is untouched", !!data.column_maps.sig_keep);

    // A mapping is matched by the account it names, however the name is spelled.
    eq("labels become ids the same way everywhere",
       API.accountIdFromLabel("Sample Card \u2014 Two"), "sample-card-two");
    eq("forgetting a mapping that is not there is harmless",
       API.forgetMappingsFor(data, "nothing-here"), 0);
  }

  describe("undoing an import that emptied an account forgets its mapping too");
  {
    const data = API.migrate({
      accounts: [{ id: "only", label: "Only", kind: "credit_card" }],
      transactions: [
        { id: "a", date: "2026-01-01", amount: -10, type: "expense", account: "only", description: "SAMPLE" },
      ],
      column_maps: { sig: { accountLabel: "Only", columns: ["Date", "Amount"] } },
    });
    const gone = API.undoImport(data, { ids: ["a"] });
    eq("the row goes", gone.removed, 1);
    eq("the mapping goes with the emptied account", gone.forgotten, 1);
    eq("nothing is left to read the file wrongly again", Object.keys(data.column_maps).length, 0);
  }

  describe("an import that leaves rows behind keeps the mapping");
  {
    const data = API.migrate({
      accounts: [{ id: "card", label: "Card", kind: "credit_card" }],
      transactions: [
        { id: "old", date: "2026-01-01", amount: -10, type: "expense", account: "card", description: "SAMPLE" },
        { id: "new", date: "2026-02-01", amount: -20, type: "expense", account: "card", description: "SAMPLE" },
      ],
      column_maps: { sig: { accountLabel: "Card", columns: ["Date", "Amount"] } },
    });
    const gone = API.undoImport(data, { ids: ["new"] });
    eq("only that import's rows go", gone.removed, 1);
    eq("the mapping stays — the account is still in use", gone.forgotten, 0);
    ok("and it is still there", !!data.column_maps.sig);
  }

  describe("accountSummaries");
  {
    const data = API.migrate({
      accounts: [{ id: "a", label: "A", kind: "credit_card" },
                 { id: "b", label: "B", kind: "checking" }],
      transactions: [
        { id: "1", date: "2026-03-01", amount: -10, type: "expense", account: "a", source_file: "a.csv" },
        { id: "2", date: "2026-01-01", amount: -20, type: "expense", account: "a", source_file: "a.csv" },
        { id: "3", date: "2026-02-01", amount: 500, type: "income",  account: "b", source_file: "b.csv" },
      ],
    });
    const s = API.accountSummaries(data);
    eq("one entry per account", s.length, 2);
    eq("counts rows", s[0].count, 2);
    eq("earliest date", s[0].first, "2026-01-01");
    eq("latest date", s[0].last, "2026-03-01");
    eq("spending for that account", s[0].totals.spend, -30);
    eq("income lands as income, not spending", s[1].totals.income, 500);
    deepEq("and it knows which file it came from", s[1].files, ["b.csv"]);
  }

  /* ------------------------------------------------------------ report */
  const summary = document.getElementById("summary");
  summary.className = failed ? "fail" : "pass";
  summary.textContent = failed
    ? `${failed} failed, ${passed} passed`
    : `All ${passed} checks passed`;
  document.title = (failed ? `✗ ${failed} failing` : `✓ ${passed} passing`) + " — Household Finances tests";
}

const frame = document.getElementById("app");
frame.addEventListener("load", () => {
  const API = frame.contentWindow.__finance;
  if (!API) {
    const summary = document.getElementById("summary");
    summary.className = "fail";
    summary.textContent = "Could not reach the app's test API. Is finances.html being served over http://localhost?";
    return;
  }
  run(API).catch((err) => {
    const summary = document.getElementById("summary");
    summary.className = "fail";
    summary.textContent = "Test run threw: " + err.message;
    console.error(err);
  });
});
</script>
</body>
</html>
