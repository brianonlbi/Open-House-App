<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Privacy: the page may not make network requests of any kind. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; manifest-src 'self'; worker-src 'self'">
<title>Preschool Social History</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Social History">
<meta name="theme-color" content="#1f6f8b">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --bg:#eef1f5; --card:#ffffff; --text:#1b2430; --muted:#5a6676; --line:#d6dce4;
    --field:#ffffff; --field-line:#b9c3cf;
    --accent:#1f6f8b; --accent-ink:#ffffff; --accent-soft:#e2eff4;
    --warn:#b42318; --ok:#25734a;
    --top:120px;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f141a; --card:#19212a; --text:#e5eaf0; --muted:#9aa7b4; --line:#2c3743;
      --field:#121920; --field-line:#3a4756;
      --accent:#62b6d4; --accent-ink:#06202a; --accent-soft:#1b3340;
      --warn:#ff8f80; --ok:#72d39f;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-padding-top:var(--top)}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  button,input,textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px}

  /* ---------- sticky top: header + section nav ---------- */
  .top{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line)}
  .bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; max-width:1100px; margin:0 auto; padding:8px 16px 6px}
  .ttl{flex:1 1 200px; min-width:0}
  .ttl h1{margin:0; font-size:18px; line-height:1.25}
  .ttl h1 .stu{font-weight:600; color:var(--accent)}
  .sub{font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:2px 10px}
  .saved{font-weight:600}
  .saved:empty{display:none}
  .saved.ok{color:var(--ok)} .saved.bad{color:var(--warn)}
  .actions{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}
  .btn{
    min-height:44px; padding:0 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); font-size:16px; font-weight:600; white-space:nowrap;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .btn.danger{color:var(--warn)}
  .secnav{display:flex; gap:6px; overflow-x:auto; max-width:1100px; margin:0 auto; padding:2px 16px 8px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
  .secnav::-webkit-scrollbar{display:none}
  .nchip{
    flex:0 0 auto; display:flex; align-items:center; gap:6px; min-height:40px; padding:0 12px;
    border-radius:999px; border:1px solid var(--line); background:var(--card);
    color:var(--text); text-decoration:none; font-size:15px; font-weight:600;
  }
  .nchip small{font-weight:500; color:var(--muted); font-size:12px}
  .nchip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .nchip.on small{color:var(--accent-ink); opacity:.85}

  /* ---------- form ---------- */
  main{max-width:1100px; margin:0 auto; padding:16px 16px 40vh}
  .sec{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:6px 20px 12px; margin:0 0 18px; scroll-margin-top:calc(var(--top) + 8px)}
  .sechead{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 12px; padding:12px 0 8px; border-bottom:2px solid var(--accent-soft)}
  .sechead h2{margin:0; font-size:21px}
  .prog{font-size:14px; color:var(--muted); font-weight:600}
  .prog.done{color:var(--ok)}
  .subhead{margin:18px 0 0; padding:6px 0; font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent)}

  .q{padding:14px 0; border-top:1px solid var(--line)}
  .subhead + .q, .sechead + .q, .sechead + .items > .q:first-child{border-top:0}
  .qrow{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
  .qlabel{flex:1 1 300px; font-weight:700; margin:0}
  .q.long > .qlabel, .q.stack > .qlabel, .q.tableq > .qlabel{display:block; margin-bottom:8px}
  .ctrls{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px}
  .qrow > .fld{flex:1 1 260px}
  .inl{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .inl > span{font-weight:600; color:var(--muted); font-size:16px}
  .inl > .fld{width:200px}

  .items.grid{display:grid; grid-template-columns:1fr 1fr; column-gap:24px}
  .items.grid > .q{border-top:0; padding:10px 0}
  .items.grid > .tableq{grid-column:1 / -1; border-top:1px solid var(--line); padding-top:16px}

  .fld{position:relative; min-width:0}
  .inp, .ta, .grow > .pv{
    width:100%; font-size:17px; line-height:1.4; padding:10px 12px;
    border:1px solid var(--field-line); border-radius:10px; background:var(--field); color:var(--text);
  }
  .inp{min-height:46px; -webkit-appearance:none; appearance:none; display:block}
  .inp[type=date]{min-height:46px}
  .inp[type=date]::-webkit-date-and-time-value{text-align:left}
  .inp:focus, .ta:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .fld > .pv{display:none}

  /* Auto-growing textarea: the hidden .pv mirror sets the height (no JS measuring,
     no scroll jump). The same mirror is what prints. */
  .grow{display:grid}
  .grow > .ta, .grow > .pv{grid-area:1 / 1 / 2 / 2; margin:0; white-space:pre-wrap; overflow-wrap:anywhere}
  .grow > .ta{resize:none; overflow:hidden; display:block}
  .grow > .pv{visibility:hidden; pointer-events:none}

  .fu{margin:10px 0 0 6px; padding:2px 0 2px 16px; border-left:3px solid var(--accent-soft); transition:opacity .15s}
  .fu + .fu{margin-top:12px}
  .fu > .flabel{display:block; font-size:16px; font-weight:600; color:var(--muted); margin-bottom:6px}
  .fu.row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px}
  .fu.row > .flabel{margin:0}
  .fu.row > .fld{flex:1 1 240px}
  .fu.dim{opacity:.6}
  .fu.dim:focus-within{opacity:1}

  /* yes / no pills and option chips */
  .yn{display:inline-flex; gap:8px}
  .pill, .opt{
    min-height:44px; border-radius:999px; border:1.5px solid var(--field-line); background:var(--field);
    font-size:16px; font-weight:600; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  .pill{min-width:72px; padding:0 16px}
  .opts{display:flex; flex-wrap:wrap; gap:8px}
  .opt{padding:0 16px; text-align:left; line-height:1.2}
  .opt::before{content:""; display:inline-block; width:16px; height:16px; margin:0 8px -2px 0; border:2px solid var(--field-line); border-radius:4px}
  .opts.single .opt::before{border-radius:50%}
  .pill[aria-pressed=true], .opt[aria-pressed=true]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .opt[aria-pressed=true]::before{border-color:var(--accent-ink); background:var(--accent-ink); box-shadow:inset 0 0 0 2px var(--accent)}

  .minis{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px 14px}
  .mini > span{display:block; font-weight:700; font-size:15px; color:var(--muted); margin-bottom:4px}

  /* tables */
  .tbl{display:grid; gap:8px}
  .tr{display:grid; grid-template-columns:var(--gtc) 44px; gap:8px; align-items:center}
  .th .td{font-size:14px; font-weight:700; color:var(--muted)}
  .td{min-width:0; margin:0}
  .td .cl{display:none}
  .rm{width:44px; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--warn); font-size:20px; font-weight:700}
  .addrow{margin-top:10px}

  @media screen and (max-width:640px){
    .items.grid{grid-template-columns:1fr}
    .minis{grid-template-columns:1fr 1fr}
    .th{display:none}
    .tr{grid-template-columns:1fr; padding:12px; border:1px solid var(--line); border-radius:12px; position:relative}
    .td .cl{display:block; font-size:14px; font-weight:700; color:var(--muted); margin-bottom:4px}
    .tr .rm{justify-self:end}
  }

  /* cover sheet */
  body.on-cover .top, body.on-cover main, body.on-cover .phead{display:none !important}
  .cover{max-width:720px; margin:0 auto; padding:32px 16px 60px}
  .cover[hidden]{display:none}
  .ccard{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; margin-bottom:20px}
  .cbrand{display:flex; align-items:center; gap:16px; margin-bottom:18px}
  .cbrand img{width:64px; height:64px; border-radius:14px}
  .cbrand h1{margin:0; font-size:26px; line-height:1.2}
  .muted{color:var(--muted); font-size:15px; margin:2px 0 0}
  .clabel{display:block; font-weight:700; margin:16px 0 6px}
  .cover .inp{font-size:19px; min-height:52px}
  .cmsg{color:var(--warn); font-weight:600; min-height:1.4em; margin:8px 0 0}
  .btn.big{width:100%; min-height:56px; font-size:19px; margin-top:12px}
  .listhead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px}
  .listhead h2{margin:0; font-size:20px}
  .ivlist{list-style:none; margin:0; padding:0}
  .ivlist li{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:12px 0; border-bottom:1px solid var(--line)}
  .ivlist li:last-child{border-bottom:0}
  .ivname{flex:1 1 220px; min-width:0}
  .ivname b{display:block; overflow-wrap:anywhere}
  .ivname small{color:var(--muted); font-size:13px}
  .empty{color:var(--muted); padding:16px 0}
  label.btn{display:inline-flex; align-items:center; justify-content:center}
  .vh{position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; clip:rect(0 0 0 0); pointer-events:none}
  a.btn{display:inline-flex; align-items:center; text-decoration:none; color:inherit}
  a.btn.primary{color:var(--accent-ink)}

  /* "file is ready" sheet, used when the Share sheet isn't available */
  .overlay{position:fixed; inset:0; z-index:50; background:rgba(10,15,20,.45); display:flex; align-items:flex-start; justify-content:center; padding:80px 16px 16px}
  .overlay[hidden]{display:none}
  .panel{background:var(--card); border-radius:16px; width:100%; max-width:520px; box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .panel header{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line)}
  .panel header h2{flex:1; margin:0; font-size:19px}
  .panelbody{padding:12px 16px 18px}
  .panelbody p{margin:6px 0 14px}
  .btnrow{display:flex; flex-wrap:wrap; gap:8px}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(120px); background:var(--text); color:var(--bg); padding:12px 18px; border-radius:12px; font-weight:600; z-index:60; transition:transform .2s; max-width:calc(100% - 32px)}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .print-only{display:none}

  /* ---------- print / save as PDF ---------- */
  @media print{
    :root{--bg:#fff; --card:#fff; --text:#000; --muted:#222; --line:#999; --field:#fff; --field-line:#777; --accent:#000; --accent-soft:#bbb; --accent-ink:#000; color-scheme:light}
    @page{margin:14mm 12mm}
    html,body{background:#fff !important; color:#000 !important}
    body{font-size:10.5pt; line-height:1.35}
    .top, .overlay, .toast, .addrow, .rm, .noprint{display:none !important}
    .print-only{display:block}
    .phead{border-bottom:2px solid #000; padding-bottom:4pt; margin-bottom:8pt}
    .phead h1{margin:0; font-size:16pt}
    main{max-width:none; padding:0}
    .sec{border:0; border-radius:0; padding:0; margin:0 0 10pt; background:#fff}
    .sechead{border-bottom:1.5px solid #000; padding:4pt 0; break-after:avoid; page-break-after:avoid}
    .sechead h2{font-size:13pt}
    .subhead{color:#000; font-size:10pt; margin-top:8pt; break-after:avoid; page-break-after:avoid}
    .q{padding:5pt 0; border-top:0.5px solid #ccc; break-inside:avoid; page-break-inside:avoid}
    .qlabel{font-weight:700}
    .inl > span{font-size:10pt; color:#222}
    .prog{display:none}
    .fu{border-left:1.5px solid #999; opacity:1 !important; margin-top:4pt}
    .fu > .flabel{color:#222; font-size:10pt; margin-bottom:2pt}

    .inp, .ta{display:none !important}
    .fld > .pv, .grow > .pv{
      display:block !important; visibility:visible !important; color:#000; background:#fff;
      border:0; border-bottom:0.75px solid #777; border-radius:0; padding:1pt 2pt; min-height:1.4em;
      font-size:10.5pt; white-space:pre-wrap; overflow-wrap:anywhere;
    }
    .grow > .pv{border:0.75px solid #999; min-height:calc(var(--lines, 2) * 1.35em + 4pt)}

    .pill, .opt{
      min-height:0; min-width:0; padding:0 8pt 0 0; border:0; border-radius:0; background:none !important;
      color:#000 !important; font-size:10.5pt; font-weight:400;
    }
    .pill::before, .opt::before{content:"\2610\00a0" !important; display:inline !important; width:auto; height:auto; margin:0; border:0 !important; background:none !important; box-shadow:none !important; font-size:12pt}
    .pill[aria-pressed=true], .opt[aria-pressed=true]{font-weight:700}
    .pill[aria-pressed=true]::before, .opt[aria-pressed=true]::before{content:"\2612\00a0" !important}
    .yn, .opts{gap:2pt}

    .tbl{gap:0}
    .tr{grid-template-columns:var(--gtc) !important; gap:0 6pt; break-inside:avoid; page-break-inside:avoid}
    .tr .rmcell{display:none}
    .th .td{color:#000; border-bottom:1px solid #000; font-size:9.5pt}
    .items.grid > .q{padding:3pt 0}
  }
</style>
</head>
<body>

<div class="top" id="top">
  <header class="bar">
    <div class="ttl">
      <h1>Social History <span class="stu" id="hdrStudent"></span></h1>
      <div class="sub">
        <span class="saved" id="saved" aria-live="polite"></span>
        <span>Answers are stored only on this device.</span>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="btnHome">Interviews</button>
      <button type="button" class="btn" id="btnNew">New</button>
      <button type="button" class="btn" id="btnPrint">Print / PDF</button>
      <button type="button" class="btn" id="btnExport">Export</button>
      <label class="btn" for="fileImport" role="button">Import</label>
    </div>
  </header>
  <nav class="secnav" id="secnav" aria-label="Sections"></nav>
</div>

<div class="print-only phead"><h1>Preschool Social History</h1></div>
<main id="form"></main>

<div class="cover" id="cover" hidden>
  <div class="ccard">
    <div class="cbrand">
      <img src="icon.png" alt="">
      <div>
        <h1>Preschool Social History</h1>
        <p class="muted">Answers are stored only on this device.</p>
      </div>
    </div>
    <form id="coverForm" novalidate>
      <label class="clabel" for="coverStudent">Student's name</label>
      <input class="inp" id="coverStudent" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go">
      <label class="clabel" for="coverDate">Date of questionnaire</label>
      <input class="inp" id="coverDate" type="date">
      <p class="cmsg" id="coverMsg" role="alert"></p>
      <button type="submit" class="btn primary big">Start questionnaire →</button>
    </form>
  </div>
  <div class="ccard">
    <div class="listhead">
      <h2>Saved interviews</h2>
      <label class="btn" for="fileImport" role="button">Import file</label>
    </div>
    <ul class="ivlist" id="ivlist"></ul>
  </div>
</div>

<input type="file" id="fileImport" class="vh" tabindex="-1" aria-hidden="true">

<div class="overlay" id="saveSheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="saveTitle">
    <header>
      <h2 id="saveTitle">Your file is ready</h2>
      <button type="button" class="btn" id="saveClose">Close</button>
    </header>
    <div class="panelbody">
      <p><b id="saveName"></b></p>
      <p class="muted" id="saveHint"></p>
      <div class="btnrow">
        <a class="btn primary" id="saveOpen" target="_blank" rel="noopener">Open file</a>
        <button type="button" class="btn" id="saveCopy" hidden>Copy text</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";

/* =====================================================================
   QUESTIONNAIRE
   Item types: h (sub-heading), short, long, yn, opts, table, group.
   yn/opts may carry `inl` (parts on the same row) and `fu` (follow-ups
   below). A follow-up's `when` ("yes" | "no") dims it until the parent
   has that answer; follow-ups without `when` are never dimmed.
   ===================================================================== */
function H(label){ return {t:"h", label:label}; }
function S(id, label, o){ return Object.assign({t:"short", id:id, label:label}, o); }
function N(id, label, o){ return S(id, label, Object.assign({num:true}, o)); }
function L(id, label, lines, o){ return Object.assign({t:"long", id:id, label:label, lines:lines}, o); }
function YN(id, label, o){ return Object.assign({t:"yn", id:id, label:label}, o); }
function O(id, label, options, o){ return Object.assign({t:"opts", id:id, label:label, options:options}, o); }
function T(id, label, cols, rows, gtc){ return {t:"table", id:id, label:label, cols:cols, rows:rows, gtc:gtc}; }
function G(id, label, parts){ return {t:"group", id:id, label:label, parts:parts}; }
// Yes/no with one textarea follow-up: id_explain.
function YNx(id, label, lines, fl, when){
  return YN(id, label, {fu:[L(id + "_explain", fl || "If yes, explain:", lines, {when: when || "yes"})]});
}
function YNno(id, label, lines, fl){ return YNx(id, label, lines, fl || "If no, explain:", "no"); }
function Until(id, label){ return YN(id, label, {inl:[S(id + "_until", "Until what age?")]}); }
function ynInl(id, label){ return {t:"yn", id:id, label:label}; }

var SECTIONS = [
  {id:"info", nav:"Info", title:"Interview Information", grid:true, items:[
    S("social_worker", "Social Worker"),
    S("date", "Date", {type:"date"}),
    S("student", "Student"),
    S("school", "School"),
    S("grade", "Grade"),
    S("teacher", "Teacher"),
    S("dob", "DOB", {type:"date"}),
    S("address", "Address"),
    S("phone", "Phone", {type:"tel"}),
    S("informants", "Informant(s)"),
    T("household", "Household", [
      {label:"Name"}, {label:"Relationship"}, {label:"DOB", type:"date"}, {label:"Occupation/Status/School Grade"}
    ], 7, "1.3fr 1fr 1fr 1.5fr")
  ]},

  {id:"family", nav:"1 Family", title:"1. Family History", items:[
    H("Mother"),
    S("mother_ethnicity", "What is the ethnicity of mother?"),
    N("mother_arrival_year", "What year did mother arrive in U.S.?"),
    S("mother_languages", "Language(s) spoken by mother"),
    S("mother_education", "Mother's highest level of education"),
    YNx("mother_ld_mh", "Does mother have history of learning difficulty and/or mental health concerns?", 3),
    YNx("mother_health", "Does mother have any health concerns?", 3),
    H("Father"),
    S("father_ethnicity", "What is the ethnicity of father?"),
    N("father_arrival_year", "What year did father arrive in U.S.?"),
    S("father_languages", "Language(s) spoken by father"),
    S("father_education", "Father's highest level of education"),
    YNx("father_ld_mh", "Does father have history of learning difficulty and/or mental health concerns?", 3),
    YNx("father_health", "Does father have any health concerns?", 3),
    H("Family"),
    YN("parents_married", "Are parents married?", {inl:[S("parents_married_how_long", "How long?")]}),
    YNno("parents_live_together", "Do parents live together?", 3, "If no, explain custody:"),
    S("family_eht_how_long", "How long has family lived in EHT?"),
    YNx("home_changes", "Have there been any significant changes in the home recently?", 3),
    YNx("family_dev_history", "Is there any family history of developmental delays, learning difficulties, special education needs, Autism, ADHD, or cognitive disabilities?", 3),
    YNx("family_mental_illness", "Is there any family history of mental illness?", 3),
    YN("dcpp", "Has DCP&P been involved with the family?", {fu:[
      L("dcpp_explain", "If yes, explain:", 3, {when:"yes"}),
      S("dcpp_caseworker", "Caseworker:", {when:"yes"})
    ]}),
    YN("ssi", "Does your child receive SSI?"),
    L("family_enjoy", "What does your family enjoy doing together?", 3),
    L("primary_concerns", "Primary concerns", 5)
  ]},

  {id:"birth", nav:"2 Birth", title:"2. Birth History", items:[
    YNno("prenatal_care", "Did mother receive prenatal care?", 2),
    YNx("preg_alcohol", "Did mother consume alcohol during pregnancy?", 2),
    YNx("preg_drugs", "Did mother use illicit drugs during pregnancy?", 2),
    YNx("preg_smoking", "Did mother smoke during pregnancy?", 2),
    YNx("preg_medications", "Did mother take prescription/OTC medications while pregnant?", 2),
    YNx("preg_complications", "Did mother have any complications during pregnancy?", 3),

/* =====================================================================
   STORAGE — every call wrapped; falls back to memory if unavailable.
   ===================================================================== */
var PFX = "psh1:";
var mem = {};
var storageOK = (function(){
  try{ var k = PFX + "probe"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();
function sGet(k){
  if(storageOK){ try{ return localStorage.getItem(PFX + k); }catch(e){} }
  return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
}
function sSet(k, v){
  mem[k] = v;
  if(!storageOK) return false;
  try{ localStorage.setItem(PFX + k, v); return true; }catch(e){ return false; }
}
function sDel(k){
  delete mem[k];
  if(storageOK){ try{ localStorage.removeItem(PFX + k); }catch(e){} }
}
function parse(s){ try{ return s ? JSON.parse(s) : null; }catch(e){ return null; } }

function getIndex(){ var a = parse(sGet("index")); return Array.isArray(a) ? a : []; }
function setIndex(a){ return sSet("index", JSON.stringify(a)); }
function loadIv(id){
  var iv = parse(sGet("iv:" + id));
  if(!iv || typeof iv !== "object" || !iv.answers || typeof iv.answers !== "object") return null;
  return iv;
}
function allIvs(){
  return getIndex().map(loadIv).filter(Boolean)
    .sort(function(a, b){ return (b.updated || "").localeCompare(a.updated || ""); });
}

function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b = new Uint8Array(16); crypto.getRandomValues(b);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  var h = Array.prototype.map.call(b, function(x){ return (x + 256).toString(16).slice(1); }).join("");
  return h.slice(0,8) + "-" + h.slice(8,12) + "-" + h.slice(12,16) + "-" + h.slice(16,20) + "-" + h.slice(20);
}
function blankIv(){ var t = new Date().toISOString(); return {id:uuid(), created:t, updated:t, answers:{}}; }

/* =====================================================================
   STATE + SAVING
   ===================================================================== */
var cur = null;            // the open interview
var persisted = false;     // has the open interview been written at least once?
var saveTimer = null;
var saveFailed = !storageOK;

function A(){ return cur.answers; }

function isEmpty(v){
  if(v == null || v === "") return true;
  if(Array.isArray(v)) return v.length === 0;
  if(typeof v === "object" && Array.isArray(v.rows))
    return v.rows.every(function(r){ return r.every(function(c){ return !c; }); });
  return false;
}

function setVal(id, v){
  if(isEmpty(v)) delete cur.answers[id]; else cur.answers[id] = v;
  scheduleSave();
  refreshDim(id);
  refreshProgress();
  if(id === "student" || id === "date") refreshHeader();
}

function scheduleSave(){
  clearTimeout(saveTimer);
  setSaved("Saving…", "");
  saveTimer = setTimeout(saveNow, 300);
}
function flushSave(){ if(saveTimer){ clearTimeout(saveTimer); if(cur) saveNow(); else saveTimer = null; } }

function saveNow(){
  saveTimer = null;
  cur.updated = new Date().toISOString();
  var ok = sSet("iv:" + cur.id, JSON.stringify(cur));
  var idx = getIndex();
  if(idx.indexOf(cur.id) < 0){ idx.push(cur.id); ok = setIndex(idx) && ok; }
  ok = sSet("current", cur.id) && ok;
  persisted = true;
  saveFailed = !ok;
  if(ok) setSaved("Saved ✓", "ok");
  else setSaved(storageOK ? "Not saved ⚠ storage full" : "Not saved ⚠ storage unavailable", "bad");
}

var $saved = document.getElementById("saved");
function setSaved(text, cls){ $saved.textContent = text; $saved.className = "saved " + cls; }

window.addEventListener("beforeunload", function(e){
  flushSave();
  if(saveFailed){ e.preventDefault(); e.returnValue = ""; return ""; }
});
window.addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") flushSave(); });

/* =====================================================================
   RENDERING
   ===================================================================== */
function el(tag, attrs){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){
    var v = attrs[k];
    if(v == null || v === false) continue;
    if(k === "class") e.className = v;
    else if(k === "text") e.textContent = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for(var i = 2; i < arguments.length; i++){
    var c = arguments[i];
    if(c == null || c === false) continue;
    if(Array.isArray(c)) c.forEach(function(x){ if(x) e.appendChild(x); });
    else e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}

function fmtDate(v){
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v || "");
  return m ? m[2] + "/" + m[3] + "/" + m[1] : (v || "");
}

/* ----- controls ----- */
function ctrlInput(it, ariaLabel){
  var type = it.type === "date" ? "date" : it.type === "tel" ? "tel" : "text";
  var inp = el("input", {
    type:type, id:"f_" + it.id, class:"inp", enterkeyhint:"next", autocomplete:"off",
    inputmode: it.num ? "numeric" : null, pattern: it.num ? "[0-9]*" : null,
    autocapitalize: type === "text" ? "sentences" : null, "aria-label": ariaLabel || null
  });
  var pv = el("div", {class:"pv", "aria-hidden":"true"});
  var v = A()[it.id];
  if(typeof v === "string") inp.value = v;
  function sync(){ pv.textContent = type === "date" ? fmtDate(inp.value) : inp.value; }
  function commit(){ sync(); setVal(it.id, inp.value); }
  sync();
  inp.addEventListener("input", commit);
  if(type === "date") inp.addEventListener("change", commit);
  return el("div", {class:"fld"}, inp, pv);
}

function ctrlText(it, ariaLabel){
  var ta = el("textarea", {id:"f_" + it.id, class:"ta", rows:it.lines || 2, autocapitalize:"sentences", "aria-label": ariaLabel || null});
  var pv = el("div", {class:"pv", "aria-hidden":"true"});
  var v = A()[it.id];
  if(typeof v === "string") ta.value = v;
  function sync(){ pv.textContent = ta.value + " "; }
  sync();
  ta.addEventListener("input", function(){ sync(); setVal(it.id, ta.value); });
  return el("div", {class:"grow", style:"--lines:" + (it.lines || 2)}, ta, pv);
}

function ctrlYN(it, label){
  var wrap = el("div", {class:"yn", role:"group", "aria-label": label || it.label});
  var btns = {};
  function paint(){
    var v = A()[it.id];
    for(var k in btns) btns[k].setAttribute("aria-pressed", String(v === k));
  }
  [["yes", "Yes"], ["no", "No"]].forEach(function(p){
    var b = el("button", {type:"button", class:"pill", "aria-pressed":"false", text:p[1]});
    b.addEventListener("click", function(){
      setVal(it.id, A()[it.id] === p[0] ? "" : p[0]);   // tapping the selected answer clears it
      paint();
    });
    btns[p[0]] = b; wrap.appendChild(b);
  });
  paint();
  return wrap;
}

function ctrlOpts(it){
  var wrap = el("div", {class:"opts" + (it.single ? " single" : ""), role:"group", "aria-label": it.label || "Options"});
  var btns = [];
  function selected(){
    var v = A()[it.id];
    if(it.single) return typeof v === "string" ? [v] : [];
    return Array.isArray(v) ? v : [];
  }
  function paint(){
    var s = selected();
    btns.forEach(function(b){ b.setAttribute("aria-pressed", String(s.indexOf(b.dataset.v) >= 0)); });
  }
  it.options.forEach(function(o){
    var b = el("button", {type:"button", class:"opt", "aria-pressed":"false", "data-v":o, text:o});
    b.addEventListener("click", function(){
      var s = selected().slice(), on = s.indexOf(o) >= 0;
      if(it.single) setVal(it.id, on ? "" : o);
      else {
        if(on) s.splice(s.indexOf(o), 1); else s.push(o);
        // keep the PDF's option order regardless of tap order
        setVal(it.id, it.options.filter(function(x){ return s.indexOf(x) >= 0; }));
      }
      paint();
    });
    btns.push(b); wrap.appendChild(b);
  });
  paint();
  return wrap;
}

function ctrlTable(it){
  var cols = it.cols;
  var saved = A()[it.id];
  var rows = saved && Array.isArray(saved.rows)
    ? saved.rows.map(function(r){ return cols.map(function(_, i){ return typeof r[i] === "string" ? r[i] : ""; }); })
    : [];
  while(rows.length < it.rows) rows.push(cols.map(function(){ return ""; }));
  var gtc = it.gtc || "repeat(" + cols.length + ", minmax(0,1fr))";

  var tbl = el("div", {class:"tbl", style:"--gtc:" + gtc});
  tbl.appendChild(el("div", {class:"tr th", "aria-hidden":"true"},
    cols.map(function(c){ return el("div", {class:"td", text:c.label}); }),

function registerDim(node, parentId, when){
  if(!when) return;
  node.dataset.when = when;
  (dimDeps[parentId] = dimDeps[parentId] || []).push({node:node, when:when});
}
function refreshDim(parentId){
  var deps = dimDeps[parentId]; if(!deps) return;
  var v = A()[parentId];

function renderInline(p){
  if(p.t === "short") return el("label", {class:"inl"}, el("span", {text:p.label}), ctrlInput(p));
  if(p.t === "yn") return el("div", {class:"inl"}, el("span", {text:p.label}), ctrlYN(p, p.label));
  if(p.t === "opts") return ctrlOpts(p);
}

function renderFollowup(f, parent){
  var node;
  var lab = f.label ? el("label", {class:"flabel", for:"f_" + f.id, text:f.label}) : null;
  if(f.t === "long") node = el("div", {class:"fu"}, lab, ctrlText(f));
  else if(f.t === "short") node = el("div", {class:"fu row"}, lab, ctrlInput(f));
  else if(f.t === "opts") node = el("div", {class:"fu"}, lab, ctrlOpts(Object.assign({}, f, {label: f.label || parent.label})));
  else if(f.t === "table") node = el("div", {class:"fu"}, ctrlTable(f));
  registerDim(node, parent.id, f.when);
  return node;
}

function renderItem(it, sec, qs){
  var fus = (it.fu || []).map(function(f){ return renderFollowup(f, it); });
  var ids = [it.id];
  var node;
  switch(it.t){
    case "h":
      return el("h3", {class:"subhead", text:it.label});
    case "short":
      node = sec.grid
        ? el("div", {class:"q stack"}, el("label", {class:"qlabel", for:"f_" + it.id, text:it.label}), ctrlInput(it))
        : el("div", {class:"q"}, el("div", {class:"qrow"}, el("label", {class:"qlabel", for:"f_" + it.id, text:it.label}), ctrlInput(it)));
      break;
    case "long":
      node = el("div", {class:"q long"}, el("label", {class:"qlabel", for:"f_" + it.id, text:it.label}), ctrlText(it));
      break;
    case "yn":
      var inl = (it.inl || []).map(renderInline);
      (it.inl || []).forEach(function(p){ ids.push(p.id); });
      node = el("div", {class:"q"},
        el("div", {class:"qrow"}, el("p", {class:"qlabel", text:it.label}), el("div", {class:"ctrls"}, ctrlYN(it), inl)));
      break;
    case "opts":
      node = el("div", {class:"q stack"}, el("p", {class:"qlabel", text:it.label}), ctrlOpts(it));
      break;
    case "table":
      node = el("div", {class:"q tableq"}, el("p", {class:"qlabel", text:it.label}), ctrlTable(it));
      break;
    case "group":
      ids = it.parts.map(function(p){ return p.id; });
      node = el("div", {class:"q stack"}, el("p", {class:"qlabel", text:it.label}),
        el("div", {class:"minis"}, it.parts.map(function(p){
          return el("label", {class:"mini"}, el("span", {text:p.label}), ctrlInput(p, it.label + " " + p.label));
        })));
      break;
  }
  fus.forEach(function(f){ node.appendChild(f); });
  qs.push(ids);
  return node;
}

var $top = document.getElementById("top");

  topH = $top.offsetHeight;
  document.documentElement.style.setProperty("--top", topH + "px");
}

function jumpTo(id){
  var s = document.getElementById("sec-" + id);
  window.scrollTo({top: s.getBoundingClientRect().top + window.pageYOffset - topH - 8, behavior:"smooth"});
}

var activeSec = null, scrollQueued = false;
function onScroll(){
  if(scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(function(){
    scrollQueued = false;
    var id = SECTIONS[0].id;
    SECTIONS.forEach(function(sec){
      var s = document.getElementById("sec-" + sec.id);
      if(s && s.getBoundingClientRect().top <= topH + 40) id = sec.id;
    });
    if((window.innerHeight + window.pageYOffset) >= document.documentElement.scrollHeight - 4)
      id = SECTIONS[SECTIONS.length - 1].id;
    if(id === activeSec) return;
    activeSec = id;
    Array.prototype.forEach.call($nav.children, function(c){
      var on = c.dataset.sec === id;
      c.classList.toggle("on", on);
      if(on){
        var l = c.offsetLeft - 16, r = c.offsetLeft + c.offsetWidth + 16;
        if(l < $nav.scrollLeft) $nav.scrollLeft = l;
        else if(r > $nav.scrollLeft + $nav.clientWidth) $nav.scrollLeft = r - $nav.clientWidth;
      }

  });
}

// "Next"/Return on a one-line field moves to the next field in document order.
$form.addEventListener("keydown", function(e){
  if(e.key !== "Enter" || !e.target.matches("input.inp")) return;
  e.preventDefault();
  var all = Array.prototype.slice.call($form.querySelectorAll("input.inp, textarea.ta"));
  var next = all[all.indexOf(e.target) + 1];
  if(next) next.focus(); else e.target.blur();
});

// Keep the focused field clear of the sticky header and the on-screen keyboard.
function ensureVisible(t){
  if(document.activeElement !== t) return;
  var vv = window.visualViewport;
  var vh = vv ? vv.height : window.innerHeight;
  var off = vv ? vv.offsetTop : 0;
  var r = t.getBoundingClientRect();
  var top = r.top - off, bottom = Math.min(r.bottom, r.top + 140) - off;
  var limit = Math.max(0, topH - off) + 10;
  if(top < limit) window.scrollBy(0, top - limit);
  else if(bottom > vh - 16) window.scrollBy(0, Math.min(bottom - (vh - 16), top - limit));
}
document.addEventListener("focusin", function(e){
  var t = e.target;
  if(!t.matches || !t.matches(".inp, .ta")) return;
  setTimeout(function(){ ensureVisible(t); }, 350);
});
if(window.visualViewport) window.visualViewport.addEventListener("resize", function(){
  var t = document.activeElement;
  if(t && t.matches && t.matches(".inp, .ta")) setTimeout(function(){ ensureVisible(t); }, 50);
});

    var a = iv.answers, d = new Doc();
    function val(id){ return typeof a[id] === "string" ? a[id] : ""; }
    function shown(it){ return it.type === "date" ? fmtDate(val(it.id)) : val(it.id); }
    function row(lh, fn){ d.need(lh); fn(d.y - lh + 3.5); d.y -= lh; }
    function sep(){
      if(d.fresh){ d.fresh = false; return; }
      d.y -= 5; d.line(M, d.y, PW - M, d.y, 0.3, 0.82); d.y -= 4;
    }
    function label(t, x, w, f, size, gray){
      wrap(enc(t), f || "F2", size || FS, w).forEach(function(l){
        row(LH, function(b){ d.text(x, b, l, f || "F2", size || FS, gray); });
      });
    }
    function drawYN(x, b, v){
      d.box(x, b, v === "yes"); d.text(x + 12, b, "Yes", v === "yes" ? "F2" : "F1", FS);
      d.box(x + 40, b, v === "no"); d.text(x + 52, b, "No", v === "no" ? "F2" : "F1", FS);
    }
    function textBlock(v, lines, x, w){
      if(v && v.trim()){
        wrap(enc(v), "F1", FS, w - 10).forEach(function(l){
          row(LH, function(b){ d.line(x + 1, b - 3.5, x + 1, b + LH - 3.5, 1.2, 0.6); if(l) d.text(x + 9, b, l, "F1", FS); });
        });
      } else {
        for(var i = 0; i < (lines || 2); i++) row(LH + 3, function(b){ d.line(x, b - 2, x + w, b - 2, 0.4, 0.7); });
      }
    }
    // inline "flow" layout: chunks wrap onto further lines as needed
    function flow(chunks, x, w){
      var rows = [], cur = [], cx = 0;
      chunks.forEach(function(c){
        if(cur.length && cx + c.w > w){ rows.push(cur); cur = []; cx = 0; }
        cur.push({c:c, off:cx}); cx += c.w;
      });
      if(cur.length) rows.push(cur);
      var heights = rows.map(function(r){ return Math.max.apply(null, r.map(function(o){ return o.c.n || 1; })) * LH; });
      var total = heights.reduce(function(p, q){ return p + q; }, 0);
      if(total <= 12 * LH) d.need(total);       // keep a short option list on one page
      rows.forEach(function(r){
        var nl = Math.max.apply(null, r.map(function(o){ return o.c.n || 1; }));
        d.need(nl * LH);
        var b = d.y - LH + 3.5;
        r.forEach(function(o){ o.c.draw(x + o.off, b); });
        d.y -= nl * LH;
      });
    }
    function cCheck(t, on){
      var s = enc(t);
      return {w:12 + tw(s, on ? "F2" : "F1", FS) + 14, draw:function(x, b){ d.box(x, b, on); d.text(x + 12, b, s, on ? "F2" : "F1", FS); }};
    }
    function cYN(t, v){
      var s = enc(t), lw = s ? tw(s, "F2", FS) + 6 : 0;
      return {w:lw + 90, draw:function(x, b){ if(s) d.text(x, b, s, "F2", FS); drawYN(x + lw, b, v); }};
    }
    function cField(t, v, maxW){
      var s = enc(t), lw = s ? tw(s, "F2", FS) + 5 : 0, avail = Math.max(60, maxW - lw - 16);
      var vl = v ? wrap(enc(v), "F1", FS, avail - 4) : [""];
      var vw = Math.min(avail, Math.max(90, Math.max.apply(null, vl.map(function(l){ return tw(l, "F1", FS); })) + 8));
      return {w:lw + vw + 16, n:vl.length, draw:function(x, b){
        if(s) d.text(x, b, s, "F2", FS);
        vl.forEach(function(l, i){
          var bb = b - i * LH;
          if(l) d.text(x + lw, bb, l, "F1", FS);
          d.line(x + lw, bb - 2.5, x + lw + vw, bb - 2.5, 0.5, 0.6);
        });
      }};
    }
    function optChunks(it){
      var v = a[it.id], sel = it.single ? (typeof v === "string" ? [v] : []) : (Array.isArray(v) ? v : []);
      return it.options.map(function(o){ return cCheck(o, sel.indexOf(o) >= 0); });
    }
    function inlChunks(p, w){
      if(p.t === "short") return [cField(p.label, shown(p), w)];
      if(p.t === "yn") return [cYN(p.label, a[p.id])];
      if(p.t === "opts") return optChunks(p);
      return [];
    }
    function shortRow(t, v, x, w){
      var lw = w * 0.48, vx = x + lw + 10, vw = w - lw - 10;
      var ll = wrap(enc(t), "F2", FS, lw), vl = v ? wrap(enc(v), "F1", FS, vw) : [""];
      var nr = Math.max(ll.length, vl.length);
      d.need(LH * Math.min(nr, 3));
      for(var i = 0; i < nr; i++) (function(i){
        row(LH, function(b){
          if(ll[i]) d.text(x, b, ll[i], "F2", FS);
          if(i < vl.length){ if(vl[i]) d.text(vx, b, vl[i], "F1", FS); d.line(vx, b - 2.5, x + w, b - 2.5, 0.5, 0.6); }
        });
      })(i);
    }
    function table(it, x, w){
      var fr = (it.gtc || "").match(/[\d.]+(?=fr)/g);
      fr = fr && fr.length === it.cols.length ? fr.map(Number) : it.cols.map(function(){ return 1; });
      var sum = fr.reduce(function(p, q){ return p + q; }, 0);
      var cw = fr.map(function(f){ return f * w / sum; });
      var saved = a[it.id], rows = saved && Array.isArray(saved.rows) ? saved.rows.slice() : [];
      while(rows.length < it.rows) rows.push([]);
      row(LH, function(b){
        var cx = x;
        it.cols.forEach(function(c, i){ d.text(cx, b, wrap(enc(c.label), "F2", 8.5, cw[i] - 6)[0], "F2", 8.5); cx += cw[i]; });
      });
      d.line(x, d.y + 1.5, x + w, d.y + 1.5, 0.8, 0);
      rows.forEach(function(r){
        var cells = it.cols.map(function(c, i){
          var v = typeof r[i] === "string" ? r[i] : "";
          return wrap(enc(c.type === "date" ? fmtDate(v) : v), "F1", 9.5, cw[i] - 8);
        });
        var nl = Math.max.apply(null, cells.map(function(c){ return c.length; }));
        d.need(nl * LH + 3);
        var b = d.y - LH + 3.5, cx = x;
        cells.forEach(function(ls, i){
          ls.forEach(function(l, j){ if(l) d.text(cx, b - j * LH, l, "F1", 9.5); });
          d.line(cx, d.y - nl * LH, cx + cw[i] - 8, d.y - nl * LH, 0.5, 0.6);
          cx += cw[i];
        });
        d.y -= nl * LH + 3;
      });
    }
    function followup(f, x, w){
      d.y -= 2;
      if(f.t === "long"){ label(f.label, x, w, "F1", 9.5, 0.25); textBlock(val(f.id), f.lines, x, w); }
      else if(f.t === "short") flow([cField(f.label, val(f.id), w)], x, w);
      else if(f.t === "opts"){ if(f.label) label(f.label, x, w, "F1", 9.5, 0.25); flow(optChunks(f), x, w); }
      else if(f.t === "table") table(f, x, w);
    }
    function item(it, x, w){
      switch(it.t){
        case "h":
          d.y -= 6; d.need(LH * 4);
          row(LH + 2, function(b){ d.text(x, b, enc(it.label.toUpperCase()), "F2", 9, 0.3); });
          d.fresh = true;
          return;
        case "short": sep(); shortRow(it.label, shown(it), x, w); break;
        case "long": sep(); d.need(LH * 3); label(it.label, x, w); textBlock(val(it.id), it.lines, x, w); break;
        case "yn":
          sep();
          var ll = wrap(enc(it.label), "F2", FS, w - 84);
          d.need(LH * Math.min(ll.length + 1, 3));
          ll.forEach(function(l, i){ row(LH, function(b){ d.text(x, b, l, "F2", FS); if(i === 0) drawYN(x + w - 72, b, a[it.id]); }); });
          if(it.inl){
            var ch = [];
            it.inl.forEach(function(p){ ch = ch.concat(inlChunks(p, w - 16)); });
            flow(ch, x + 16, w - 16);
          }
          break;
        case "opts": sep(); d.need(LH * 3); label(it.label, x, w); flow(optChunks(it), x + 16, w - 16); break;
        case "table": sep(); d.need(LH * 4); if(it.label) label(it.label, x, w); table(it, x, w); break;
        case "group":
          sep(); d.need(LH * 3); label(it.label, x, w);
          flow(it.parts.map(function(p){ return cField(p.label + ":", val(p.id), (w - 16) / 2); }), x + 16, w - 16);
          break;
      }
      (it.fu || []).forEach(function(f){ followup(f, x + 16, w - 16); });
    }

    // ---- cover page
    row(30, function(b){ d.text(M, b, enc("Preschool Social History"), "F2", 24); });
    d.line(M, d.y - 4, PW - M, d.y - 4, 1.5, 0);
    d.y -= 34;
    [["Student", val("student")], ["Date of questionnaire", fmtDate(val("date"))]].forEach(function(p){
      row(14, function(b){ d.text(M, b, enc(p[0]), "F1", 10, 0.35); });
      row(28, function(b){ if(p[1]) d.text(M, b + 2, enc(p[1]), "F2", 20); d.line(M, b - 3, M + 360, b - 3, 0.6, 0.5); });
      d.y -= 14;
    });
    d.y -= 6;
    row(18, function(b){ d.text(M, b, enc("Interview Information"), "F2", 13); });
    d.line(M, d.y + 1, PW - M, d.y + 1, 1, 0);
    d.y -= 6; d.fresh = true;
    SECTIONS[0].items.forEach(function(it){ if(it.id !== "student" && it.id !== "date") item(it, M, CW); });

    // ---- the questionnaire
    d.add();
    SECTIONS.slice(1).forEach(function(sec, i){
      if(i) d.y -= 16;
      d.need(90);
      row(20, function(b){ d.text(M, b, enc(sec.title), "F2", 14); });
      d.line(M, d.y + 1, PW - M, d.y + 1, 1.2, 0);
      d.y -= 6; d.fresh = true;
      sec.items.forEach(function(it){ item(it, M, CW); });
    });

    var who = enc((val("student") || "Untitled") + (val("date") ? " – " + fmtDate(val("date")) : ""));
    return d.bytes("Preschool Social History - " + (val("student") || "Untitled"), function(doc, pg, total){
      doc.line(M, 44, PW - M, 44, 0.4, 0.7);
      doc.text(M, 32, enc("Preschool Social History · ") + who, "F1", 8, 0.35);
      var t = "Page " + pg + " of " + total;
      doc.text(PW - M - tw(t, "F1", 8), 32, t, "F1", 8, 0.35);
    });
  }
  return {build:build};
})();

/* =====================================================================
   PRINT / EXPORT / IMPORT
   ===================================================================== */
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function safeName(s){
  s = (s || "").trim();
  if(s.normalize) s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");   // José Núñez -> Jose Nunez
  return s.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
function fileBase(){
  return "SocialHistory_" + (safeName(A().student) || "Untitled") + "_" + (A().date || todayISO());
}

var $saveSheet = document.getElementById("saveSheet");
var $saveOpen = document.getElementById("saveOpen");
var $saveCopy = document.getElementById("saveCopy");
var saveUrl = null, saveText = "";
// Fallback when the Share sheet can't take the file: a link the user taps
// themselves (a fresh tap always works, even in a Home Screen app).
function showSaveSheet(blob, name, text){
  if(saveUrl) URL.revokeObjectURL(saveUrl);
  saveUrl = URL.createObjectURL(blob);
  saveText = text || "";
  $saveOpen.href = saveUrl;
  if(text) $saveOpen.setAttribute("download", name); else $saveOpen.removeAttribute("download");
  document.getElementById("saveName").textContent = name;
  document.getElementById("saveHint").textContent = text
    ? "Tap Open file to save it, or Copy text and paste it into an email or note."
    : "Tap Open file, then the Share button to Print, Save to Files, AirDrop or Mail it.";
  $saveCopy.hidden = !text;
  $saveSheet.hidden = false;
}
document.getElementById("saveClose").addEventListener("click", function(){ $saveSheet.hidden = true; });
$saveSheet.addEventListener("click", function(e){ if(e.target === $saveSheet) $saveSheet.hidden = true; });
$saveCopy.addEventListener("click", function(){
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(saveText).then(function(){ toast("Copied"); }, function(){ alert("Couldn't copy on this device."); });
  else alert("Couldn't copy on this device.");
});

// Must run straight from a tap: iOS only opens the Share sheet in response to one.
function deliver(blob, name, type, text){
  var file = null;
  try{ file = new File([blob], name, {type:type}); }catch(e){}
  var canShare = file && navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}));
  if(canShare){
    navigator.share({files:[file], title:name}).catch(function(err){
      if(err && err.name === "AbortError") return;     // user closed the sheet
      showSaveSheet(blob, name, text);
    });
    return;
  }
  if(isIOS()){ showSaveSheet(blob, name, text); return; }
  var url = URL.createObjectURL(blob);
  var link = el("a", {href:url, download:name});
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
  toast("Saved " + name + " to Downloads");
}

document.getElementById("btnPrint").addEventListener("click", function(){
  flushSave();
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if(!isIOS()){ window.print(); return; }
  var bytes;
  try{ bytes = PDF.build(cur); }
  catch(err){ alert("Couldn't build the PDF: " + (err && err.message)); return; }
  deliver(new Blob([bytes], {type:"application/pdf"}), fileBase() + ".pdf", "application/pdf");
});

document.getElementById("btnExport").addEventListener("click", function(){
  flushSave();
  var text = JSON.stringify({app:"preschool-social-history", version:1, id:cur.id, created:cur.created, updated:cur.updated, answers:A()}, null, 2);
  deliver(new Blob([text], {type:"application/json"}), fileBase() + ".json", "application/json", text);
});

var $file = document.getElementById("fileImport");
$file.addEventListener("change", function(){
  var f = $file.files && $file.files[0];
  if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    $file.value = "";
    var data = parse(rd.result);
    var answers = data && cleanAnswers(data.answers);
    if(!answers){ alert("That file isn't a Social History export (.json)."); return; }
    var t = new Date().toISOString();
    var iv = {
      id: typeof data.id === "string" && data.id ? data.id : uuid(),
      created: typeof data.created === "string" ? data.created : t,
      updated: typeof data.updated === "string" ? data.updated : t,
      answers: answers
    };
    var idx = getIndex();
    if(idx.indexOf(iv.id) >= 0){
      if(!confirm("This interview is already saved on this device.\n\nReplace the saved copy with the file?")) return;
    } else idx.push(iv.id);
    var ok = sSet("iv:" + iv.id, JSON.stringify(iv)) && setIndex(idx);
    if(!ok) saveFailed = true;
    openIv(iv, true);
    toast(ok ? "Interview imported" : "Imported, but couldn't save to this device");
  };
  rd.onerror = function(){ $file.value = ""; alert("Couldn't read that file."); };
  rd.readAsText(f);
});

// Accept only the value shapes the form itself writes.
function cleanAnswers(a){
  if(!a || typeof a !== "object" || Array.isArray(a)) return null;
  var out = {};
  Object.keys(a).forEach(function(k){
    var v = a[k];
    if(typeof v === "string") out[k] = v;
    else if(Array.isArray(v)) out[k] = v.filter(function(x){ return typeof x === "string"; });
    else if(v && Array.isArray(v.rows))
      out[k] = {rows: v.rows.filter(Array.isArray).map(function(r){ return r.map(function(c){ return typeof c === "string" ? c : ""; }); })};
  });
  return out;
}

/* =====================================================================
   BOOT — reopen the interview that was on screen, else the cover sheet
   ===================================================================== */
(function boot(){
  var id = sGet("current"), iv = id && loadIv(id);
  if(iv && sGet("view") === "form") return openIv(iv, true);
  showCover(false);
})();
if(!storageOK) setSaved("Not saved ⚠ storage unavailable", "bad");

if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
})();
</script>
